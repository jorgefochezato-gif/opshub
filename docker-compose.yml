services:
  postgres:
    image: postgres:17
    container_name: opshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub_dev
      POSTGRES_DB: opshub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
