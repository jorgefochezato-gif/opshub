name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://opshub:opshub_dev@localhost:5432/opshub_ci?schema=public"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opshub
          POSTGRES_PASSWORD: opshub_dev
          POSTGRES_DB: opshub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opshub -d opshub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @opshub/database db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Apply migrations to clean database
        run: pnpm --filter @opshub/database exec prisma migrate deploy

      - name: Verify migration status
        run: pnpm --filter @opshub/database exec prisma migrate status

      - name: Run deterministic seed
        run: pnpm --filter @opshub/database db:seed

      - name: Verify repeatable seed
        run: pnpm --filter @opshub/database db:seed
